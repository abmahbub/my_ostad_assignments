<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript Assignment</title>
  <style>
    body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
    section { margin-bottom: 30px; border-bottom: 1px solid #ddd; padding-bottom: 20px; }
    button { padding: 8px 16px; margin: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <section id="part1">
    <h1 id="heading">My Website</h1>
    <p class="desc">Welcome to my website</p>
    <button id="change-btn">Change Text</button>
  </section>

  <section id="part2">
    <button id="msg-btn">Show Message</button>
    <p id="timer-msg"></p>
  </section>

  <section id="part3">
    <h2>Counter: <span id="counter-value">0</span></h2>
    <button id="start-btn">Start</button>
    <button id="stop-btn">Stop</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
